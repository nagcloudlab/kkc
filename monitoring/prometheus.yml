global:
  scrape_interval: 5s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"
  - "alert-rules.yml"

scrape_configs:
  # - job_name: 'prometheus'
  #   static_configs:
  #     - targets: ['prometheus:9090']

  # - job_name: 'node_exporter'
  #   static_configs:
  #     - targets: ['node_exporter:9100']
        
  - job_name: 'kafka-brokers'
    static_configs:
      - targets:
          - 'host.docker.internal:7071'
          - 'host.docker.internal:7072'
          - 'host.docker.internal:7073'
        labels:
          cluster: 'local-kraft'
      
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['host.docker.internal:9308']
        
  - job_name: 'keydb'
    static_configs:
      - targets: ['host.docker.internal:7074',
                'host.docker.internal:7075',
                'host.docker.internal:7076']    

  - job_name: 'cassandra'
    static_configs:
      - targets: ['host.docker.internal:7077',
                'host.docker.internal:7078',
                'host.docker.internal:7079']                    