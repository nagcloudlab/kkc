groups:
- name: kafka-exporter-lag
  rules:
  - alert: KafkaExporterDown
    expr: up{job="kafka-exporter"} == 0
    for: 2m
    labels: {severity: critical}
    annotations:
      summary: "Kafka Exporter is down on {{ $labels.instance }}"

  - alert: KafkaHighConsumerLag
    expr: max by (consumergroup) (kafka_consumergroup_lag) > 10000
    for: 1m
    labels: {severity: warning}
    annotations:
      summary: "High consumer lag"
      description: "Max lag > 10k for 10m (group={{ $labels.consumergroup }})"

  - alert: KafkaLagGrowing
    expr: |
      (
        sum by (topic) (rate(kafka_topic_partition_current_offset[5m]))
        - sum by (topic) (rate(kafka_consumergroup_current_offset[5m]))
      ) > 0
    for: 1m
    labels: {severity: warning}
    annotations:
      summary: "Backlog growing"
      description: "Production rate exceeds consumption for 10m (topic={{ $labels.topic }})"

  - alert: KafkaStalledConsumerGroup
    expr: |
      (max_over_time(kafka_consumergroup_current_offset[15m]) - min_over_time(kafka_consumergroup_current_offset[15m])) == 0
      and
      max_over_time(kafka_consumergroup_lag[15m]) > 0
    for: 1m
    labels: {severity: critical}
    annotations:
      summary: "Stalled consumer group"
      description: "Offsets not advancing for 15m while lag > 0"

  - alert: KafkaUnderReplicatedPartitions
    expr: sum(kafka_topic_partition_under_replicated_partition) > 0
    for: 5m
    labels: {severity: critical}
    annotations:
      summary: "Under-replicated partitions detected"
