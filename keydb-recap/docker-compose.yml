version: '3.8'

services:
      
  m1:
    image: eqalpha/keydb
    container_name: multi-master1
    command: keydb-server /etc/keydb/keydb.conf
    ports:
      - "6382:6379"
    volumes:
      - ./multi-master1.conf:/etc/keydb/keydb.conf
    cap_add:
      - NET_ADMIN 
  
  m2:
    image: eqalpha/keydb
    container_name: multi-master2
    command: keydb-server /etc/keydb/keydb.conf
    ports:
      - "6383:6379"
    volumes:
      - ./multi-master2.conf:/etc/keydb/keydb.conf
    cap_add:
      - NET_ADMIN      
    
  
